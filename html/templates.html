<template id="tpl-search-book">
    <div id="book-list-div">
        <div class="search_book_div">
            <label>搜索的属性</label>
            <select id="book-selector" title="属性选择">
                <option>book-id</option><option>书名</option><option>入库时间</option>
            </select>
            <input id="search-ctnt" placeholder="请输入搜索内容" type="text">
            <input type="button" value="搜索" class="search-btn">
        </div>
        <table id="rst-ls-table">
            <thead><tr><td>book-id</td><td>书名</td><td>入库时间</td><td>当前状态</td><td>标的价格</td></tr></thead>
            <tbody id="book-ls-body"></tbody>
        </table>
    </div>
</template>

<template id="tpl-rcd-list">
    <div id="comm-div">
        <select><option value="borrow">借书</option><option value="return">还书</option></select>
        <label>书本uuid为</label>
        <input type="text" class="br-book-input">
        <input type="button" value="提交" class="br-submit-btn">
    </div>
    <div id="rcd-list-div">
        <div class="search_book_div rcd-search" style="display:none">
            <label>搜索的属性</label>
            <select id="rcd-selector" title="属性选择">
                <option>订单编号</option><option>book-id</option><option>书名</option><option>UUID</option><option>账号</option><option>姓名</option><option>卡号</option>
            </select>
            <input id="search-ctnt" placeholder="请输入搜索内容" type="text">
            <input type="button" value="搜索" class="search-btn">
        </div>
        <table id="rst-ls-table">
            <thead><tr><td>订单编号</td><td>书名</td><td>书本编号</td><td>用户名</td><td>姓名</td><td>用户编号</td><td>操作类型</td></tr></thead>
            <tbody id="rcd-ls-body"></tbody>
        </table>
    </div>
</template>

<template id="tpl-book-store">
    <form id="book-in-form">
        <div class="book-info-row" id="book-info-row0"><label>书名:</label><input type="text" id="book-info-input0"></div>
        <div class="book-info-row" id="book-info-row1"><label>价格:</label><input type="text" id="book-info-input1"></div>
        <input type="button" id="book_info_btn" value="入库">
    </form>
</template>

<template id="tpl-user-list">
    <div id="user-list-div">
        <div class="search_book_div">
            <label>搜索的属性</label>
            <select id="user-selector" title="属性选择">
                <option>UUID</option><option>账号</option><option>姓名</option><option>卡号</option>
            </select>
            <input id="search-ctnt" placeholder="请输入搜索内容" type="text">
            <input type="button" value="搜索" class="search-btn">
        </div>
        <table id="rst-ls-table">
            <thead><tr><td>UUID</td><td>账号</td><td>姓名</td><td>卡号</td><td>权限</td><td>联系电话</td><td>邮箱</td></tr></thead>
            <tbody id="user-ls-body"></tbody>
        </table>
    </div>
    <div class="user-edit-div">
        <label>修改uuid为</label><input type="text" class="edit-uuid">
        <label>的用户的</label>
        <select class="edit-field"><option>姓名</option><option>卡号</option><option>权限</option><option>联系电话</option><option>邮箱</option></select>
        <label>为</label><input type="text" class="edit-value">
        <input type="button" value="修改" class="edit-btn">
    </div>
</template>

<template id="tpl-my-info">
    <div id="info-card">
        <div id="user-box">
            <img src="./image/none_avatar.png" alt=".none_avatar" height="300">
            <div id="tip">(头像功能暂未实现)</div>
            <div id="person-name"></div>
        </div>
        <div id="info-box">
            <div class="info-div" id="info-div0"><a class="info-tag" id="info-tag0">姓名:</a><a class="info_ctnt" id="info_ctnt0">未设置</a></div>
            <div class="info-div" id="info-div1"><a class="info-tag" id="info-tag1">卡号:</a><a class="info_ctnt" id="info_ctnt1">未设置</a></div>
            <div class="info-div" id="info-div2"><a class="info-tag" id="info-tag2">联系电话:</a><a class="info_ctnt" id="info_ctnt2">未设置</a></div>
            <div class="info-div" id="info-div3"><a class="info-tag" id="info-tag3">电子邮箱:</a><a class="info_ctnt" id="info_ctnt3">未设置</a></div>
            <div class="info-div" id="info-div4"><a class="info-tag" id="info-tag4">住址:</a><a class="info_ctnt" id="info_ctnt4">未设置</a></div>
        </div>
    </div>
</template>

<template id="tpl-change-info">
    <div id="info-input">
        <div id="info-box-lable">个人信息更改</div>
        <form id="self-info-form">
            <div class="info-input-div" id="input-div0"><a class="info-input-tag" id="input-tag0">姓名: </a><input type="text" class="info-input-ctnt" id="input-ctnt0" placeholder="姓名"></div>
            <div class="info-input-div" id="input-div1"><a class="info-input-tag" id="input-tag1">卡号: </a><input type="text" class="info-input-ctnt" id="input-ctnt1" placeholder="卡号"></div>
            <div class="info-input-div" id="input-div2"><a class="info-input-tag" id="input-tag2">联系电话: </a><input type="text" class="info-input-ctnt" id="input-ctnt2" placeholder="联系电话"></div>
            <div class="info-input-div" id="input-div3"><a class="info-input-tag" id="input-tag3">电子邮箱: </a><input type="text" class="info-input-ctnt" id="input-ctnt3" placeholder="电子邮箱"></div>
            <div class="info-input-div" id="input-div4"><a class="info-input-tag" id="input-tag4">住址: </a><input type="text" class="info-input-ctnt" id="input-ctnt4" placeholder="住址"></div>
            <input type="button" id="self-info-btn" value="修改">
        </form>
        <div id="acct-lable">账户信息更改</div>
        <form id="acct-info-form">
            <div class="info-input-div" id="acct-input-div0"><a class="info-input-tag" id="acct-input-tag0">用户名: </a><input type="text" class="info-input-ctnt" id="acct-input-ctnt0" placeholder="用户名"></div>
            <div class="info-input-div" id="acct-input-div1"><a class="info-input-tag" id="acct-input-tag1">密码: </a><input type="password" class="info-input-ctnt" id="acct-input-ctnt1" placeholder="密码"></div>
            <div class="info-input-div" id="acct-input-div2"><a class="info-input-tag" id="acct-input-tag2">再次输入: </a><input type="password" class="info-input-ctnt" id="acct-input-ctnt2" placeholder="再次输入"></div>
            <input type="button" id="acct-info-btn" value="修改">
        </form>
    </div>
</template>

<template id="tpl-sql-execute">

        <label>SQL:</label>
        <input type="text" id="sql-input" placeholder="sql语句">

<template id="tpl-backup-restore">
    <div id="backup-div">
        <input type="text" placeholder="请输入数据库备份名" class="backup-name-input">
        <input type="button" value="备份" class="backup-btn">
    </div>
    <table id="rst-ls-table">
        <thead id="rst-ls-head"><tr><td><a>备份名称</a></td></tr></thead>
        <tbody id="rst-ls-body"></tbody>
    </table>
    <div id="r-d-div" style="display:none">
        <select class="rd-select" title="r-d-select"></select>
        <input type="button" value="恢复" class="restore-btn">
        <input type="button" value="删除" class="delete-btn">
    </div>
</template>
